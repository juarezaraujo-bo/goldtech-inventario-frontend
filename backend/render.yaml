services:
  - type: web
    runtime: node
    name: goldtech-inventario-api
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: inventory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/inventory.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_TOKEN
        generateValue: true
      - key: HELPDESK_API_URL
        sync: false
      - key: HELPDESK_API_TOKEN
        sync: false
